[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-throughput"
version = "0.3.0"
description = "What your AI coding subscriptions really cost per token: a local usage database over Claude Code, Codex and Kimi session logs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amir Fish" }]
dependencies = []
keywords = ["claude-code", "codex", "kimi", "token-usage", "cost", "sqlite"]

[project.scripts]
throughput = "throughput.cli:main"

[tool.setuptools]
packages = ["throughput", "throughput.adapters"]

[tool.setuptools.package-data]
throughput = ["rates.json"]
